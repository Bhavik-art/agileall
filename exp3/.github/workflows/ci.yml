name: Experiment 3 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-python-example:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run multiplication table example
        run: python multiplication_table.py 5
